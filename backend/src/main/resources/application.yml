server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rakshasphere-backend
  
  # H2 In-Memory DB for zero-dependency local dev & testing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:rakshaspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
rakshasphere:
  jwt:
    secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

# Rate Limiting
rate-limit:
  max-requests-per-minute: ${RATE_LIMIT_MAX_REQUESTS:100}
