server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rakshasphere-backend
  
  # H2 In-Memory DB for zero-dependency local dev & testing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:rakshaspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${SPRING_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:${REDIS_SSL_ENABLED:false}}
      timeout: 5000

# JWT Configuration
rakshasphere:
  jwt:
    secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  ai:
    url: ${RAKSHASPHERE_AI_URL:${AI_ENGINE_URL:http://localhost:5000}}
  honeypot:
    manager-url: ${HONEYPOT_MANAGER_URL:http://localhost:6000}
    manager-api-key: ${HONEYPOT_MANAGER_API_KEY:changeme}


# Rate Limiting
rate-limit:
  max-requests-per-minute: ${RATE_LIMIT_MAX_REQUESTS:100}

# Threat Intelligence API Configuration
threat-intel:
  virustotal:
    api-key: ${VIRUSTOTAL_API_KEY:}
  abuseipdb:
    api-key: ${ABUSEIPDB_API_KEY:}

# Spring Actuator Observability
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true



