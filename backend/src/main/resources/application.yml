server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rakshasphere-backend
  
  # H2 In-Memory DB for zero-dependency local dev & testing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:rakshaspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000

# JWT Configuration
rakshasphere:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

# Rate Limiting
rate-limit:
  max-requests-per-minute: ${RATE_LIMIT_MAX_REQUESTS:100}
