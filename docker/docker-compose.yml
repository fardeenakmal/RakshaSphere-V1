version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: raksha-mysql
    ports:
      - "3307:3306"
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-001974}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rakshaspheredb}
      MYSQL_USER: ${MYSQL_USER:-raksha_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_user_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: raksha-mosquitto
    network_mode: host
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro

  redis:
    image: redis:7-alpine
    container_name: raksha-redis
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: raksha-ai-engine
    network_mode: host
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: raksha-backend
    network_mode: host
    env_file:
      - ../.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3307/${MYSQL_DATABASE:-rakshaspheredb}?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-raksha_user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-change_this_user_password}
      - RAKSHASPHERE_AI_URL=http://localhost:5000
      - SPRING_REDIS_HOST=localhost
      - JWT_SECRET=${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - HONEYPOT_MANAGER_URL=http://localhost:6000
      - HONEYPOT_MANAGER_API_KEY=${HONEYPOT_MANAGER_API_KEY:-changeme}
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - database
      - redis
      - ai-engine


  frontend:
    image: docker-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: raksha-frontend
    network_mode: host
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend



  nginx:
    image: nginx:latest
    container_name: raksha-nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  db-backup:
    image: alpine:latest
    container_name: raksha-db-backup
    network_mode: host
    env_file:
      - ../.env
    command: >
      /bin/sh -c "apk add --no-cache mysql-client &&
      echo '0 2 * * * /usr/bin/mysqldump -h 127.0.0.1 -u$${MYSQL_USER:-raksha_user} -p$${MYSQL_PASSWORD:-change_this_user_password} $${MYSQL_DATABASE:-rakshaspheredb} > /backups/backup-$$(date +\\%Y\\%m\\%d).sql' > /etc/crontabs/root &&
      crond -f"
    volumes:
      - ./backups:/backups
    depends_on:
      - database

  iot-agent:
    build:
      context: ../iot-agent
      dockerfile: Dockerfile
    container_name: raksha-iot-agent
    network_mode: host
    depends_on:
      - mqtt-broker

  honeypot-manager:
    build:
      context: ../honeypot-manager
      dockerfile: Dockerfile
    container_name: raksha-honeypot-manager
    network_mode: host
    environment:
      - HONEYPOT_MANAGER_API_KEY=${HONEYPOT_MANAGER_API_KEY:-changeme}
      - BACKEND_URL=http://localhost:8080
      - HONEYPOT_NETWORK=honeypot_net
      - COWRIE_IMAGE=cowrie/cowrie:latest
      - COWRIE_SSH_PORT=2222
      - MAX_HONEYPOTS=5
      - LOG_DIR=/logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /logs:/logs
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:6000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  ebpf-collector:
    build:
      context: ../ebpf-collector
      dockerfile: Dockerfile
    container_name: raksha-ebpf-collector
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rshared
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/api/ebpf/status')\""]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  honeypot_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mysql-data:
  cowrie-logs:
