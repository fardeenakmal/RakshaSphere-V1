version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: raksha-mysql
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD || mysqladmin ping -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: raksha-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro

  redis:
    image: redis:7-alpine
    container_name: raksha-redis
    ports:
      - "6379:6379"

#  ai-engine:
#    build:
#      context: ../ai-engine
#      dockerfile: Dockerfile
#    container_name: raksha-ai-engine
#    ports:
#      - "5000:5000"
#    environment:
#      - PORT=5000

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: raksha-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-raksha_user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-change_this_user_password}
      - RAKSHASPHERE_AI_URL=http://ai-engine:5000
      - SPRING_REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: raksha-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

#  iot-agent:
#    build:
#      context: ../iot-agent
#      dockerfile: Dockerfile
#    container_name: raksha-iot-agent
#    depends_on:
#      - mqtt-broker
#      - backend

  nginx:
    image: nginx:latest
    container_name: raksha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  db-backup:
    image: alpine:latest
    container_name: raksha-db-backup
    env_file:
      - ../.env
    command: >
      /bin/sh -c "apk add --no-cache mysql-client &&
      echo '0 2 * * * /usr/bin/mysqldump -h database -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} > /backups/backup-$$(date +\\%Y\\%m\\%d).sql' > /etc/crontabs/root &&
      crond -f"
    volumes:
      - ./backups:/backups
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql-data:
